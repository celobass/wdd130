<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Questionário online com perguntas básicas sobre HTML e CSS.">

    <meta name="author" content="Marcelo Alves de Lima">

    <title>Questionário de HTML e CSS</title>

    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>
    <main>
        <h1>Questionário de HTML e 00CSS</h1>

        <form>
            <div class="form-item">
                <label for="q1">
                    1. O que significa a sigla CSS?
                </label>

                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="form-item">
                <label for="q2">
                    2. Como os atributos id e class são selecionados no CSS?
                </label>

                <textarea id="q2" name="q2" rows="5" required></textarea>
            </div>

            <div class="form-item">
                <label for="q3">
                    3. Qual das opções abaixo é um comentário CSS válido?
                </label>

                <select id="q3" name="q3" required>
                    <option value="" selected disabled>
                        Escolha uma...
                    </option>

                    <option value="html-comment">
                        &lt;!-- Este é um comentário --&gt;
                    </option>

                    <option value="css-comment">
                        /* Este é um comentário */
                    </option>

                    <option value="double-slash">
                        // Este é um comentário
                    </option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">
                    4. Qual é a margem inferior dada por esta declaração?
                </label>

                <div class="codigo">
                    margin: 10px 5px 15px;
                </div>

                <input type="number" id="q4" name="q4" min="0" required>
            </div>

            <button type="submit">
                Enviar Questionário
            </button>
        </form>
    </main>
</body>

</html>
